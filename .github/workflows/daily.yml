name: Daily episode

on:
  # PAUSED 2026-10-28 (owner): cloud autopilot held until the private laptop pipeline passes all quality gates.
  # To resume, restore the schedule block:  - cron: "7 4 * * *"   and   - cron: "41 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test mode: make the next episode but do NOT upload (download it from the run page)"
        type: boolean
        default: false

concurrency:
  group: daily-episode
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Keep the schedule switched on
        # GitHub pauses scheduled workflows after 60 days without commits; re-enabling every run prevents it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable" || true

      - name: Free disk space (footage downloads need room)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Search and vision cache (small; footage itself is downloaded fresh)
        uses: actions/cache@v4
        with:
          path: |
            work/cache/search
            work/cache/pages
            work/cache/scenes
            work/cache/vision
          key: meta-${{ github.run_id }}
          restore-keys: meta-

      - name: Refresh the archive index (Sundays)
        if: github.event_name == 'schedule' && github.event.schedule == '7 4 * * *'
        run: |
          if [ "$(date -u +%u)" = "7" ]; then python tools/build_index.py || true; fi

      - name: Make and schedule episodes
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COSMOS_GIT_PUSH: ${{ inputs.dry_run && '0' || '1' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name "cosmos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$DRY_RUN" = "true" ]; then python -m cosmos.pipeline --dry-run; exit 0; fi
          if [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::notice::YouTube is not connected yet (add the YT_* secrets once Google approves the API audit). Nothing to do."
            exit 0
          fi
          python -m cosmos.pipeline

      - name: Save the refreshed index
        if: ${{ !inputs.dry_run }}
        run: |
          git add assets/index state episodes || true
          git commit -m "index + state refresh" || true
          git pull --rebase -X ours || true
          git push || true

      - name: Attach test video
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: test-episode
          path: out/
          retention-days: 7
